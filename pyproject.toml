[project]
name = "efficient-ml-benchmark"
version = "0.1.0"
description = "Reproducible benchmark of pruning and quantization accuracy-efficiency trade-offs (CIFAR-10 / ResNet-18)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
